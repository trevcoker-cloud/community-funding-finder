name: Update funds and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find new funds and re-check sources
        run: python tools/daily.py

      - name: Bump asset version when the dataset changed
        run: |
          if git diff --quiet -- js/data.js; then
            echo "dataset unchanged"
            exit 0
          fi
          STAMP="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          sed -i -E "s/\?v=[0-9A-Za-z._-]+/?v=${STAMP}/g" index.html
          echo "asset version -> ${STAMP}"

      - name: Commit the new data
        run: |
          git config user.name "fund-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Daily fund update $(date -u +%Y-%m-%d)"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect the site files
        run: |
          mkdir -p _site
          cp -r index.html css js data-check _site/
          rm -rf _site/data-check/snapshots _site/data-check/backups
          rm -f _site/data-check/daily.log

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
